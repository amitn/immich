#
# The AI assistant in the dev setup, as docker-compose.assistant.yml does for the production image: the ACP agents
# (Claude Code and Codex) run in the gallery-agents container, and the dev server starts them there. The dev server
# also gets the fonts of the photo book renderer. Use it on top of docker-compose.dev.yml:
#
#   docker compose -f docker-compose.dev.yml -f docker-compose.dev.assistant.yml up --build --remove-orphans
#
# Set AGENT_HOST_SECRET in .env first. Log in with `docker exec -it gallery_agents claude` (then /login) or
# `docker exec -it gallery_agents codex login --device-auth`, or set ANTHROPIC_API_KEY / OPENAI_API_KEY in .env.
# Check with `docker exec gallery_agents gallery-check-assistant`.
#

services:
  immich-server:
    # its own image: immich-init shares immich-server-dev:latest (the dev target)
    image: immich-server-dev:assistant
    build:
      target: dev-assistant
    environment:
      AGENT_HOST_URL: http://gallery-agents:2285
      AGENT_HOST_SECRET: ${AGENT_HOST_SECRET:?set AGENT_HOST_SECRET in .env (see example.env)}
      AGENT_MCP_URL: http://immich-server:2283/api/agent/mcp
    networks:
      - default
      - agents
    depends_on:
      gallery-agents:
        condition: service_healthy

  gallery-agents:
    container_name: gallery_agents
    image: gallery-agents:dev
    build:
      context: ../
      dockerfile: server/Dockerfile
      target: gallery-agents
    environment:
      AGENT_HOST_SECRET: ${AGENT_HOST_SECRET:?set AGENT_HOST_SECRET in .env (see example.env)}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TZ: ${TZ:-}
    volumes:
      - agent-home:/var/lib/gallery-agents
    networks:
      - agents
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=2g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 4g
    cpus: 2
    restart: unless-stopped

networks:
  agents:

volumes:
  agent-home:
